<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>phplives.dev: coming soon</title>
<meta name="description" content="A running showcase of what people are shipping in PHP right now. Coming soon.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&amp;family=JetBrains+Mono:wght@600&amp;display=swap">
<style>
:root{--field:#e6eaf2;--on-field:#12285a;--on-field-2:#3a4870;--line:rgba(18,40,90,.18);--label:#ffffff;--ink:#121212;
  --shadow:0 1px 0 rgba(18,40,90,.14),0 16px 30px -16px rgba(18,40,90,.38);color-scheme:light}
@media (prefers-color-scheme:dark){:root{--field:#0d1d42;--on-field:#eef1f8;--on-field-2:#bccbe8;--line:rgba(238,241,248,.16);--label:#e4e4dc;
  --shadow:0 1px 0 rgba(0,0,0,.35),0 18px 34px -14px rgba(0,0,0,.7);color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;background:var(--field);color:var(--on-field);
  font-family:'Archivo',system-ui,sans-serif;font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{width:100%;max-width:1120px;margin:0 auto;padding:0 40px}
header.wrap{padding-top:20px;padding-bottom:20px;border-bottom:1px solid var(--line)}
.mark{font-weight:800;font-stretch:75%;font-size:21px;letter-spacing:-.01em}
main.wrap{flex:1;display:flex;align-items:center;padding-top:72px;padding-bottom:72px}
h1{margin:0;font-size:clamp(52px,9vw,112px);line-height:.94;font-weight:850;font-stretch:70%;letter-spacing:-.02em}
h1 span{display:block}
h1 .stuck{display:inline-block;margin-top:14px;background:var(--label);color:var(--ink);padding:4px 18px 10px;border-radius:5px;transform:rotate(-1.2deg);box-shadow:var(--shadow)}
.lede{margin:32px 0 0;max-width:40ch;font-size:20px;color:var(--on-field-2)}
.soon{display:inline-block;margin:28px 0 0;border:1.5px solid var(--on-field);font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:6px 12px;border-radius:3px}
footer.wrap{padding-top:28px;padding-bottom:40px;border-top:1px solid var(--line);font-size:15px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px 32px}
footer p{margin:0}
a{color:inherit;text-underline-offset:.22em;text-decoration-thickness:1px}
a:hover{text-decoration-thickness:2px}
a:focus-visible{outline:2px solid var(--on-field);outline-offset:3px;border-radius:2px}
@media (max-width:700px){.wrap{padding:0 16px}main.wrap{padding-top:48px;padding-bottom:48px}.lede{font-size:18px}}
</style>
</head>
<body>
  <header class="wrap"><span class="mark">phplives.dev</span></header>
  <main class="wrap">
    <div>
      <h1><span>PHP delivers.</span> <span class="stuck">PHP lives!</span></h1>
      <p class="lede">A running showcase of what people are shipping in PHP right now.</p>
      <p class="soon">Coming soon</p>
    </div>
  </main>
  <footer class="wrap">
    <p>Made by <a href="https://albertoarena.it/?utm_source=phplives.dev&amp;utm_medium=footer" target="_blank" rel="noopener">Alberto Arena</a>.</p>
    <p><a href="https://cogway.dev/?utm_source=phplives.dev&amp;utm_medium=footer" target="_blank" rel="noopener">cogway.dev</a></p>
  </footer>
</body>
</html>
