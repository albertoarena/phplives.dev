name: Deploy

# Builds the site and deploys it to Cloudflare Workers.
# It runs on every push to main, and once a day, so entries older than 6 months
# move to the archive without a commit (decision 9).
#
# wrangler.jsonc says which folder goes live: ./dist, which the build step
# writes just before the deploy.
#
# The Cloudflare API token expires once a year. The maintainer notes say how to renew it.

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run Pest
        run: vendor/bin/pest

      - name: Build the site
        run: bin/build

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.151.1'
          command: deploy
