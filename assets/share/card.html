<!doctype html>
<!--
  Source of assets/share/card.png, the 1200x630 link preview image.
  Render it with a browser at 1200x630, device scale 1, then save as PNG.
  It uses the site's own fonts and colours.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
@font-face{font-family:'Archivo';font-style:normal;font-weight:100 900;font-stretch:62% 125%;src:url(../fonts/archivo-latin.woff2) format('woff2')}
@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:400 600;src:url(../fonts/jetbrains-mono-latin.woff2) format('woff2')}
html,body{margin:0}
/* Some sites (dev/null, chat apps) crop the preview to the middle square, 630x630.
   Everything that must be read sits in that square. The waves and the postmark sit
   outside it, so a square crop loses only decoration. */
.card{width:1200px;height:630px;box-sizing:border-box;background:#12285a;color:#f4f7f2;font-family:'Archivo',sans-serif;position:relative;overflow:hidden}
.middle{position:absolute;left:300px;top:0;width:600px;height:630px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.url{font-family:'JetBrains Mono',monospace;font-size:24px;font-weight:600;letter-spacing:.04em;color:#bccbe8;margin-bottom:30px}
h1{margin:0;font-size:86px;line-height:.92;font-weight:850;font-stretch:70%;letter-spacing:-.02em;word-spacing:.12em}
h1 span{display:block}
h1 .stuck{display:inline-block;margin-top:16px;background:#fff;color:#121212;padding:6px 22px 12px;border-radius:6px;transform:rotate(-1.2deg);box-shadow:0 22px 40px -18px rgba(0,0,0,.6)}
p{margin:30px 0 0;font-size:27px;line-height:1.3;color:#bccbe8;max-width:none}
.waves{position:absolute;left:56px;top:50%;width:200px;height:90px;margin-top:-45px;color:#4a67a8}
.pm{position:absolute;right:62px;top:50%;width:210px;height:210px;margin-top:-105px;color:#ff5a1f;transform:rotate(-9deg)}
</style>
</head>
<body>
<div class="card">
  <svg class="waves" viewBox="0 0 120 54" preserveAspectRatio="none" aria-hidden="true">
    <path d="M0 8 q7.5 -6 15 0 t15 0 t15 0 t15 0 t15 0 t15 0 t15 0 t15 0" fill="none" stroke="currentColor" stroke-width="2.4"/>
    <path d="M0 27 q7.5 -6 15 0 t15 0 t15 0 t15 0 t15 0 t15 0 t15 0 t15 0" fill="none" stroke="currentColor" stroke-width="2.4"/>
    <path d="M0 46 q7.5 -6 15 0 t15 0 t15 0 t15 0 t15 0 t15 0 t15 0 t15 0" fill="none" stroke="currentColor" stroke-width="2.4"/>
  </svg>
  <div class="middle">
    <div class="url">phplives.dev</div>
    <h1><span>PHP delivers.</span> <span class="stuck">PHP lives!</span></h1>
    <p>Real things people shipped<br>with PHP in the last 6 months.</p>
  </div>
  <svg class="pm" viewBox="0 0 120 120" aria-hidden="true">
    <defs>
      <path id="pt" d="M 18 60 A 42 42 0 0 1 102 60"></path>
      <path id="pb" d="M 14 60 A 46 46 0 0 0 106 60"></path>
    </defs>
    <circle cx="60" cy="60" r="56" fill="none" stroke="currentColor" stroke-width="3"></circle>
    <circle cx="60" cy="60" r="34" fill="none" stroke="currentColor" stroke-width="1.6"></circle>
    <text fill="currentColor" font-family="Archivo, sans-serif" font-size="11.5" font-weight="800" letter-spacing="2.2"><textPath href="#pt" startOffset="50%" text-anchor="middle">PHPLIVES.DEV</textPath></text>
    <text fill="currentColor" font-family="Archivo, sans-serif" font-size="11.5" font-weight="800" letter-spacing="2.6"><textPath href="#pb" startOffset="50%" text-anchor="middle">SHIPPED</textPath></text>
    <text x="60" y="66" fill="currentColor" font-family="JetBrains Mono, monospace" font-size="15" font-weight="600" text-anchor="middle">PHP</text>
  </svg>
</div>
</body>
</html>
